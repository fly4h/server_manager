name: image

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # 保证 PR 阶段就能发现跨平台编译问题（例如误用了 Windows 专属 API）
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend (required by go:embed)
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: go vet
        run: go vet ./...
      - name: Cross compile
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/sm-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/sm-arm64 ./cmd/server

  docker:
    needs: cross-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
